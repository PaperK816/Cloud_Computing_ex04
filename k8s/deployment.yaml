apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-native-lab
  template:
    metadata:
      labels:
        app: cloud-native-lab
    spec:
      containers:
        - name: web
          image: cloud-native-lab:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config